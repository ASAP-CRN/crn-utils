[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "crn-utils"
version = "0.3.0"
description = "Collection of tools and utilities for ASAP CRN Cloud Datasets"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "markdown",
    "xhtml2pdf",
    "python-docx",
]


[project.urls]
Documentation = "https://github.com/ASAP-CRN/crn-utils#readme"
Source = "https://github.com/ASAP-CRN/crn-utils"
Tracker = "https://github.com/ASAP-CRN/crn-utils"


[tool.setuptools.packages.find]
where = ["src"]

